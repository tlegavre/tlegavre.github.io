about:
  text: |
    I am a PhD student in cryptology at [ALMASTY](https://almasty.team.lip6.fr/)
    ([LIP6](https://www.lip6.fr), [Sorbonne Université](https://www.sorbonne-universite.fr)),
    [Thales](https://www.thalesgroup.com) and [ANSSI](https://cyber.gouv.fr) (French National Cybersecurity Agency),
    where I am supervised by [Damien Vergnaud](https://perso.lip6.fr/Damien.Vergnaud/) and co-supervised by
    [Thomas Ricosset](https://scholar.google.com/citations?user=UE7nIekAAAAJ) (Thales) and
    [Ange Martinelli](https://scholar.google.com/citations?user=W3Ol2B8AAAAJ) (ANSSI).

    My research focuses on lattice-based cryptography, and more specifically on Fiat-Shamir with
    Aborts signature schemes and also on lattice problems with leakage, such as
    [Hint-MLWE](https://latticeassumptionzoo.org/hint-lwe/). More precisely, I study how to integrate
    side information obtained through physical attacks into cryptanalysis, and how to design
    algorithms that safely release partial information while preserving security.

